guerriero:
  name: "&c⚔ Guerriero"
  permission: "duelli.kit.guerriero"
  icon: "DIAMOND_SWORD"
  description:
    - "&7Kit bilanciato per il combattimento ravvicinato"
    - "&7Armatura di diamante completa"
    - "&7Spada affilata e arco con frecce infinite"
  items:
    - slot: 0
      material: DIAMOND_SWORD
      name: "&cSpada del Guerriero"
      lore:
        - "&7Danno base: &c10"
        - "&7Affilatezza V & Durabilità III"
      enchantments:
        DAMAGE_ALL: 5
        DURABILITY: 3
    - slot: 1
      material: BOW
      name: "&cArco del Guerriero"
      lore:
        - "&7Potenza III & Frecce Infinite"
      enchantments:
        ARROW_DAMAGE: 3
        ARROW_INFINITE: 1
        DURABILITY: 3
    - slot: 8
      material: ARROW
      amount: 1
    - slot: 2
      material: GOLDEN_APPLE
      amount: 8
      name: "&6Mela d'Oro"
    - slot: 3
      material: COOKED_BEEF
      amount: 32
      name: "&cManzo Cotto"
  armor:
    helmet:
      material: DIAMOND_HELMET
      name: "&bElmo del Guerriero"
      enchantments:
        PROTECTION_ENVIRONMENTAL: 4
        DURABILITY: 3
        AQUA_AFFINITY: 1
    chestplate:
      material: DIAMOND_CHESTPLATE
      name: "&bCorazza del Guerriero"
      enchantments:
        PROTECTION_ENVIRONMENTAL: 4
        DURABILITY: 3
    leggings:
      material: DIAMOND_LEGGINGS
      name: "&bGambali del Guerriero"
      enchantments:
        PROTECTION_ENVIRONMENTAL: 4
        DURABILITY: 3
    boots:
      material: DIAMOND_BOOTS
      name: "&bStivali del Guerriero"
      enchantments:
        PROTECTION_ENVIRONMENTAL: 4
        DURABILITY: 3
        DEPTH_STRIDER: 3
        FEATHER_FALLING: 4
  potion-effects:
    - type: SPEED
      amplifier: 0
      duration: 999999
    - type: INCREASE_DAMAGE
      amplifier: 0
      duration: 999999

