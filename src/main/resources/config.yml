# Configurazione DuelliRealistici
# Versione configurazione: 1.0

# ============================================
# IMPOSTAZIONI GENERALI
# ============================================
general:
  prefix: "&8[&bDuelli&8] &r"
  duel-world: "duelli_world"
  cooldown-seconds: 30
  challenge-timeout: 30
  max-duel-duration: 300
  disable-commands-during-duel: true
  blocked-commands:
    - "home"
    - "spawn"
    - "tp"
    - "tpa"
    - "back"
    - "warp"
  particle-effects: true
  sounds: true

# ============================================
# IMPOSTAZIONI MONDO DUELLI
# ============================================
duel-world:
  auto-generate: true
  world-type: "FLAT"
  spawn-1:
    x: 100.5
    y: 64
    z: 100.5
    yaw: 180.0
    pitch: 0.0
  spawn-2:
    x: 120.5
    y: 64
    z: 120.5
    yaw: 0.0
    pitch: 0.0
  world-border-radius: 50
  protect-blocks: true
  prevent-item-drop: true
  return-delay: 5

# ============================================
# MYSQL CONFIGURAZIONE
# ============================================
mysql:
  enabled: true
  host: "localhost"
  port: 3306
  database: "coralmc_duelli"
  username: "root"
  password: ""
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
  tables:
    stats: "duelli_stats"
    history: "duelli_history"

# ============================================
# ECONOMIA / RICOMPENSE (Vault)
# ============================================
rewards:
  enabled: true
  winner:
    money: 100.0
    commands:
      - "give %winner% diamond 5"
      - "lp user %winner% permission settemp duelli.winner 1d"
    items:
      - "DIAMOND:3"
      - "GOLDEN_APPLE:2"
  loser:
    money: 10.0
    commands: []
    items: []
  draw:
    money: 25.0
    commands: []
    items:
      - "IRON_INGOT:5"

# ============================================
# LEADERBOARD
# ============================================
leaderboard:
  entries-per-page: 10
  types:
    - "vittorie"
    - "duelli"
    - "winrate"
    - "streak"
  cache-update-minutes: 5

# ============================================
# KIT CONFIGURAZIONE
# ============================================
kits:
  config-file: "kits.yml"
  default-kit: "guerriero"
  allow-custom-kits: false

